<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        label.error {
            display: none !important;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-size: cover;
        }

        form {
            border: 1px solid #c3c3c3;
            padding: 15px;
            width: 320px;
        }

            form input {
                width: 100%;
                height: 50px;
                border: 1px solid #c3c3c3;
                border-radius: 5px;
                margin-bottom: 10px;
                padding: 0 15px;
                display: flex;
                align-items: center;
            }

                form input.error {
                    border-color: red;
                }

            form textarea {
                width: 100%;
                border: 1px solid #c3c3c3;
                border-radius: 5px;
                margin-bottom: 10px;
                padding: 15px;
                display: flex;
                align-items: center;
                line-height: 18px;
            }

            form button {
                height: 50px;
                width: 100%;
                cursor: pointer;
            }
        p {
            text-align: center;
            color: maroon;
            font-size: x-large;
            height: 58px;
            margin-bottom: 0;
        }
    </style>
</head>

<body background="img/10f.png">
  
    <form action="sender.php" method="post">
<a href="basket.html"><img src="img/31.png" style="margin-left: 90%;"></a>
